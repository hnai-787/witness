category: software
subcategory: "Introduction to Software Engineering coursework (CS112)"

status: completed

visibility: public

description:
  short: "A real Selenium WebDriver/pytest E2E suite (Page Object Model, RBAC-UI and forced-browsing tests) against GuardSIS, plus real Locust load results -- rebuilt from an original Selenium IDE report."
  long: |
    Originally a non-functional (load/stress) testing exercise using
    Selenium IDE's record-and-playback tooling against two targets: Air
    University's student-portal login page and Wikipedia's search engine.
    Built for an Introduction to Software Engineering course (Air
    University, Semester 2, Spring 2024). See the Ethical Notice
    regarding testing a real, live third-party system without documented
    authorization.
    Rebuilt with e2e/: a real, version-controlled Selenium WebDriver 4.48
    + pytest suite (Page Object Model, Page Component Objects, explicit
    waits, Selenium Manager) retargeted entirely at GuardSIS (a local
    app this same effort built) -- login, CRUD, search, pagination, and
    real browser-level RBAC/forced-browsing verification, complementing
    GuardSIS's own server-side pytest suite. Building it found and
    fixed six real bugs, including a genuine rate-limiting bug in Project
    #7 itself. A separate Locust HTTP-level load experiment (1/5/10/20
    simulated users) produced real, committed quantitative results.

